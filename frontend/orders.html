<!doctype html>
<html lang="th">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ออเดอร์ - เส้นทางอร่อย</title>
  <link rel="stylesheet" href="common.css">
  <script src="auth.js" data-role="owner"></script>
</head>

<body>
  <div id="top"></div>
  <main>
    <section class="card">
      <h2>จัดการออเดอร์ <span id="orderCount" class="msg"></span></h2>
      <div class="row" style="margin-bottom:12px">
        <select id="oCust" style="min-width:220px"></select>
        <select id="oBoxes">
          <option>1</option>
          <option>2</option>
          <option>3</option>
        </select><span>กล่อง</span>
        <button onclick="addOrder()">➕ เพิ่มออเดอร์</button>
        <span style="flex:1"></span>
        <input id="simCount" type="number" min="1" max="60" placeholder="จำนวน (ว่าง = สุ่ม 20–30)" style="width:190px">
        <button class="sec" onclick="simulate()">🎲 สุ่มออเดอร์ทดสอบ</button>
        <label class="msg" style="display:flex;gap:4px;align-items:center"><input id="delSimCust" type="checkbox"> ลบลูกค้าจำลองด้วย</label>
        <button class="sec" onclick="clearOrders()">ลบออเดอร์ทั้งหมด</button>
      </div>
      <div class="scroll" style="max-height:520px">
        <table>
          <thead>
            <tr>
              <th>#</th>
              <th>ลูกค้า</th>
              <th>เบอร์โทร</th>
              <th>ที่อยู่</th>
              <th class="n">จำนวน (กล่อง)</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
      <p class="msg">ลูกค้าสั่งได้ไม่เกิน 3 กล่องต่อออเดอร์ · แก้จำนวนกล่องได้จากช่องในตาราง</p>
    </section>
    <section class="card">
      <h2>ค้นหาออเดอร์ใกล้จุดที่เลือก <span id="nearCount" class="msg"></span></h2>
      <div class="row" style="margin-bottom:12px">
        <input id="nLat" type="number" step="any" placeholder="ละติจูด (lat)" style="width:150px">
        <input id="nLng" type="number" step="any" placeholder="ลองจิจูด (lng)" style="width:150px">
        <input id="nRadius" type="number" min="0.1" step="0.1" value="2" style="width:90px"><span>กม.</span>
        <button onclick="nearbyOrders()">📍 ค้นหา</button>
        <button class="sec" onclick="useCustomerPoint()">ใช้พิกัดบ้านลูกค้าที่เลือกด้านบน</button>
      </div>
      <div class="scroll" style="max-height:360px">
        <table>
          <thead>
            <tr>
              <th>#</th>
              <th>วันที่</th>
              <th>ลูกค้า</th>
              <th>เบอร์โทร</th>
              <th>ที่อยู่</th>
              <th class="n">กล่อง</th>
              <th class="n">ห่าง (กม.)</th>
            </tr>
          </thead>
          <tbody id="nearRows"></tbody>
        </table>
      </div>
      <p class="msg">ค้นจากออเดอร์ทุกวัน เรียงจากใกล้ไปไกล · เว้นพิกัดว่างไว้ = ใช้ตำแหน่งร้าน</p>
    </section>
  </main>
  <script src="common.js"></script>
  <script>
    renderTop("orders", true);
    window.onDateChange = loadOrders;
    let customers = [];

    async function loadOrders() {
      try {
        const [rows, cs] = await Promise.all([call("/order?date=" + $("date").value), call("/customer")]);
        customers = cs;
        const keep = $("oCust").value;
        $("oCust").innerHTML = cs.map((c) => `<option value="${c.id}">${esc(c.firstname)} ${esc(c.lastname)} (${esc(c.phone)})</option>`).join("");
        if (keep) $("oCust").value = keep;
        $("orderCount").textContent = `(${rows.length} ออเดอร์, ${rows.reduce((s, o) => s + o.boxes, 0)} กล่อง)`;
        $("rows").innerHTML = rows.length
          ? rows.map((o) => `<tr><td>${o.id}</td><td>${esc(o.firstname)} ${esc(o.lastname)}</td><td>${esc(o.phone)}</td><td>${esc(o.address)}</td>
          <td class="n"><select onchange="editBoxes(${o.id}, Number(this.value))">${[1, 2, 3].map((n) => `<option ${n === o.boxes ? "selected" : ""}>${n}</option>`).join("")}</select></td>
          <td><button class="sec" onclick="delOrder(${o.id})">🗑️ ลบ</button></td></tr>`).join("")
          : `<tr><td colspan="6" class="msg">ยังไม่มีออเดอร์ในวันนี้ — เพิ่มเองหรือกด "สุ่มออเดอร์ทดสอบ"</td></tr>`;
      } catch (e) { toast("โหลดออเดอร์ไม่ได้: " + e.message); }
    }
    async function addOrder() {
      if (!$("oCust").value) { toast("ยังไม่มีลูกค้า — เพิ่มลูกค้าก่อน"); return; }
      try { await call("/order", "POST", { customerId: Number($("oCust").value), boxes: Number($("oBoxes").value), date: $("date").value }); toast("เพิ่มออเดอร์แล้ว"); loadOrders(); } catch (e) { toast(e.message); }
    }
    async function editBoxes(id, boxes) {
      try { await call("/order/" + id, "PUT", { boxes }); toast("แก้จำนวนกล่องแล้ว"); loadOrders(); } catch (e) { toast(e.message); }
    }
    async function delOrder(id) {
      try { await call("/order/" + id, "DELETE"); loadOrders(); } catch (e) { toast(e.message); }
    }
    async function simulate() {
      const n = $("simCount").value.trim();
      try {
        const r = await call("/order/simulate", "POST", { date: $("date").value, ...(n ? { count: Number(n) } : {}) });
        toast(`สุ่มออเดอร์แล้ว ${r.created} รายการ`); loadOrders();
      } catch (e) { toast(e.message); }
    }
    async function clearOrders() {
      const withCust = $("delSimCust").checked;
      if (!confirm("ลบออเดอร์ทั้งหมดในระบบ (ทุกวัน)" + (withCust ? " และลูกค้าจำลองที่ระบบสร้างไว้" : "") + "?")) return;
      try {
        const r = await call("/order/simulate" + (withCust ? "?customers=true" : ""), "DELETE");
        toast(`ลบออเดอร์ ${r.deleted_orders} รายการ` + (withCust ? ` และลูกค้าจำลอง ${r.deleted_customers} คน` : "")); loadOrders();
      } catch (e) { toast(e.message); }
    }
    function useCustomerPoint() {
      const c = customers.find((x) => String(x.id) === $("oCust").value);
      if (!c) { toast("เลือกลูกค้าด้านบนก่อน"); return; }
      $("nLat").value = c.lat; $("nLng").value = c.lng;
    }
    async function nearbyOrders() {
      const empty = $("nLat").value.trim() === "" && $("nLng").value.trim() === "";
      const lat = empty ? SHOP.lat : Number($("nLat").value), lng = empty ? SHOP.lng : Number($("nLng").value), radius = Number($("nRadius").value);
      if (isNaN(lat) || isNaN(lng) || !(radius > 0)) { toast("พิกัดและรัศมีต้องเป็นตัวเลข (รัศมีมากกว่า 0)"); return; }
      try {
        const rows = await call(`/order/nearby?lat=${lat}&lng=${lng}&radius=${radius}`);
        $("nearCount").textContent = `(รัศมี ${radius} กม. พบ ${rows.length} ออเดอร์, ${rows.reduce((s, o) => s + o.boxes, 0)} กล่อง)`;
        $("nearRows").innerHTML = rows.map((o) => `<tr><td>${o.id}</td><td>${esc(o.order_date)}</td><td>${esc(o.firstname)} ${esc(o.lastname)}</td><td>${esc(o.phone)}</td><td>${esc(o.address)}</td><td class="n">${o.boxes}</td><td class="n">${o.distance_km}</td></tr>`).join("")
          || `<tr><td colspan="7" class="msg">ไม่มีออเดอร์ในรัศมีนี้</td></tr>`;
      } catch (e) { toast(e.message); }
    }
    loadOrders();
  </script>
</body>

</html>
