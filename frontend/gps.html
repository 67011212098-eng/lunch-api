<!doctype html>
<html lang="th">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>เส้นทางอร่อย - จัดเส้นทางจัดส่ง</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="common.css">
  <script src="auth.js" data-role="owner"></script>
  <style>
    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 10px;
      margin-bottom: 14px
    }

    .stat {
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 10px 12px
    }

    .stat span {
      display: block;
      font-size: 12px;
      color: var(--mute)
    }

    .stat b {
      font-size: 20px
    }

    .profit.pos {
      color: var(--ok)
    }

    .profit.neg {
      color: var(--bad)
    }

    .stat.loss {
      background: #fff0f0;
      border-color: var(--bad)
    }

    .alert {
      background: #fff0f0;
      border: 1px solid var(--bad);
      color: #a61e1e;
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 12px
    }

    .alert.warn {
      background: #fff9db;
      border-color: #f59f00;
      color: #7a5200
    }

    #mapModal {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, .55);
      z-index: 2000;
      display: none;
      padding: 2vh 2vw
    }

    #mapModal.open {
      display: flex
    }

    .mbox {
      background: #fff;
      border-radius: 12px;
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden
    }

    .mhead {
      padding: 10px 14px;
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
      border-bottom: 1px solid var(--line)
    }

    .mhead .grow {
      flex: 1
    }

    .mbody {
      flex: 1;
      display: flex;
      min-height: 0
    }

    #map {
      flex: 1;
      min-height: 300px
    }

    .side {
      width: 320px;
      overflow: auto;
      padding: 12px;
      border-left: 1px solid var(--line);
      font-size: 14px
    }

    .legend div {
      margin: 4px 0
    }

    @media(max-width:800px) {
      .mbody {
        flex-direction: column
      }

      .side {
        width: auto;
        max-height: 40%;
        border-left: 0;
        border-top: 1px solid var(--line)
      }
    }
  </style>
</head>

<body>
  <div id="top"></div>

  <main>
    <section class="card">
      <h2>จัดเส้นทางจัดส่ง</h2>
      <div class="row" style="margin-bottom:12px">
        <button class="big" id="btnPlan" onclick="optimize(true)">คำนวณเส้นทาง</button>
        <button class="big sec" id="btnMap" onclick="openMap()" disabled>🗺️ ดูแผนที่ขนาดใหญ่</button>
        <button class="big sec" id="btnClear" onclick="clearPlan()">🧹 ส่งเสร็จแล้ว / ล้างแผน</button>
        <button class="big sec" onclick="deleteDayPlans()">🗑️ ลบแผนที่ยืนยันทั้งหมดของวันที่เลือก</button>
      </div>
      <div id="result">
        <p class="msg">กด "คำนวณเส้นทาง" เพื่อให้ระบบเสนอเส้นทางจัดส่ง</p>
      </div>
    </section>

    <section class="card" id="confirmed" style="display:none">
      <h2>ยืนยันแผนแล้ว — รหัสงานของไรเดอร์</h2>
      <button class="sec" onclick="clearPlan()" style="margin-bottom:10px">🧹 ส่งเสร็จแล้ว / ล้างแผน</button>
      <div id="jobs"></div>
    </section>
  </main>

  <div id="mapModal">
    <div class="mbox">
      <div class="mhead">
        <b class="grow" id="mapTitle">แผนที่เส้นทาง</b>
        <button onclick="optimize(false)" id="btnRe2">🔄 คำนวณใหม่</button>
        <button class="sec" onclick="closeMap()">ปิด ✕</button>
      </div>
      <div class="mbody">
        <div id="map"></div>
        <div class="side" id="mapSide"></div>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="common.js"></script>
  <script>
    renderTop("gps", true);
    window.onDateChange = async () => { await loadOrders(); restoreState(); };

    let data = null;      // ผลล่าสุดจาก /route/optimize (แผนที่ดีที่สุดแผนเดียว)
    let map, layer;
    let confirmedPlan = null, mapOpen = false, ordersSig = "";

    /* ---------- จำสถานะไว้ (รีเฟรชแล้วหน้ายังเหมือนเดิม) ---------- */
    const KEY = "gpsState";
    const allState = () => { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch { return {}; } };
    function saveState() {
      try {
        const all = allState(), d = $("date").value;
        if (data) all[d] = { data, confirmedPlan, mapOpen, sig: ordersSig }; else delete all[d];
        localStorage.setItem(KEY, JSON.stringify(all));
      } catch { }
    }
    function restoreState() {
      const s = allState()[$("date").value];
      if (!s || !s.data || !s.data.riders) return;
      if (s.sig !== ordersSig) { toast("ออเดอร์เปลี่ยนไปจากตอนคำนวณ จึงต้องคำนวณเส้นทางใหม่"); saveStateClear(); return; }
      data = s.data; confirmedPlan = s.confirmedPlan;
      $("btnMap").disabled = false;
      render();
      if (confirmedPlan) showPlan(confirmedPlan);
      if (s.mapOpen) openMap();
    }
    function saveStateClear() { try { const all = allState(); delete all[$("date").value]; localStorage.setItem(KEY, JSON.stringify(all)); } catch { } }

    /* ---------- โหลดออเดอร์ของวัน (จากหน้าจัดการออเดอร์) ---------- */
    async function loadOrders() {
      try {
        const rows = await call("/order?date=" + $("date").value);
        ordersSig = rows.map((o) => o.id + ":" + o.boxes).join(",");
        data = null; confirmedPlan = null; $("btnMap").disabled = true;
        $("mapModal").classList.remove("open"); mapOpen = false; $("confirmed").style.display = "none";
        $("result").innerHTML = `<p class="msg">วันนี้มี ${rows.length} ออเดอร์ (${rows.reduce((s, o) => s + o.boxes, 0)} กล่อง) · กด "คำนวณเส้นทาง" เพื่อให้ระบบเสนอเส้นทางจัดส่ง</p>`;
      } catch (e) { toast("โหลดออเดอร์ไม่ได้: " + e.message); }
    }

    /* ---------- คำนวณเส้นทาง ---------- */
    async function optimize(openAfter, seed) {
      const btns = [$("btnPlan"), $("btnRe2")];
      btns.forEach((b) => (b.disabled = true));
      try {
        data = await call("/route/optimize", "POST", { date: $("date").value, ...(seed ? { seed } : {}) });
        if (!data.riders.length) { toast("ไม่มีออเดอร์ในวันนี้"); data = null; $("btnMap").disabled = true; return; }
        $("btnMap").disabled = false;
        render();
        saveState();
        if (openAfter) openMap(); else drawMap();
      } catch (e) { toast(e.message); }
      finally { btns.forEach((b) => (b.disabled = false)); }
    }

    // ค้นหาแผนที่ไม่ขาดทุน: สุ่ม seed ใหม่ซ้ำ ๆ จนกว่าจะมีตัวเลือกที่กำไร >= 0
    async function reoptimizeNoLoss() {
      const btns = [...document.querySelectorAll(".btnNoLoss")];
      btns.forEach((b) => (b.disabled = true));
      try {
        let best = null;
        for (let i = 1; i <= 15; i++) {
          toast(`กำลังหาเส้นทางที่ไม่ขาดทุน… (${i}/15)`);
          const d = await call("/route/optimize", "POST", { date: $("date").value });
          if (!best || d.summary.profit > best.summary.profit) best = d;
          if (best.summary.profit >= 0) break;
        }
        data = best; render(); drawMap(); saveState();
        toast(best.summary.profit >= 0 ? "พบเส้นทางที่ไม่ขาดทุนแล้ว" : "ลองแล้วยังขาดทุน — ที่ดีที่สุดคือขาดทุนน้อยสุดที่แสดงอยู่");
      } catch (e) { toast(e.message); }
      finally { btns.forEach((b) => (b.disabled = false)); }
    }

    /* ---------- แสดงผลสรุป ---------- */
    function summaryHTML(o) {
      const s = o.summary, loss = s.profit < 0;
      return `
  ${loss ? `<div class="alert">⚠️ แผนนี้ <b>ขาดทุน ${money(-s.profit)}</b> (ค่าไรเดอร์สูงกว่ากำไรจากอาหาร)
    <div style="margin-top:8px"><button class="btnNoLoss" onclick="reoptimizeNoLoss()">คำนวณเส้นทางใหม่ให้ไม่ขาดทุน</button></div></div>` : ""}
  ${s.lateCount ? `<div class="alert warn">⏰ มี ${s.lateCount} จุดที่ถึงช้ากว่ากำหนด 12:30</div>` : ""}
  <div class="stats">
    <div class="stat"><span>รายได้</span><b>${money(s.revenue)}</b></div>
    <div class="stat"><span>ต้นทุนอาหาร</span><b>${money(s.foodCost)}</b></div>
    <div class="stat"><span>ค่าจ้างไรเดอร์</span><b>${money(s.riderCost)}</b></div>
    <div class="stat ${loss ? "loss" : ""}"><span>${loss ? "ขาดทุน" : "กำไร"}</span><b class="profit ${loss ? "neg" : "pos"}">${money(s.profit)}</b></div>
    <div class="stat"><span>เวลาที่ใช้ส่ง</span><b>${Math.round(s.durationMin)} นาที</b><span>เสร็จ ${s.finishTime}</span></div>
    <div class="stat"><span>ไรเดอร์ / ระยะทางรวม</span><b>${s.riders} คน · ${s.totalKm} กม.</b></div>
  </div>`;
    }
    function ridersTable(o) {
      return `<table><thead><tr><th>ไรเดอร์</th><th class="n">กล่อง</th><th class="n">กม.</th><th class="n">ค่าจ้าง</th><th class="n">เสร็จ</th></tr></thead><tbody>${o.riders.map((r) =>
        `<tr><td><span class="dot" style="background:${r.color}"></span>คนที่ ${r.riderNo}${r.lateCount ? " ⏰" : ""}</td><td class="n">${r.boxes}</td><td class="n">${r.km}</td><td class="n">${money(r.fee)}</td><td class="n">${r.finishTime}</td></tr>`).join("")}</tbody></table>`;
    }
    function render() {
      $("result").innerHTML = `
    ${summaryHTML(data)}${ridersTable(data)}
    <div class="row" style="margin-top:14px">
      <button class="sec" onclick="optimize(false)">🔄 คำนวณใหม่ / เสนอเส้นทางอื่น</button>
      <button class="sec" onclick="openMap()">🗺️ ดูแผนที่ขนาดใหญ่</button>
      <button onclick="confirmPlan()">✅ ยืนยันแผนนี้</button>
    </div>`;
      renderSide();
    }

    function renderSide() {
      if (!data) return;
      $("mapSide").innerHTML = `${summaryHTML(data)}
    <div class="legend"><b>สีเส้นทาง</b> <span class="msg">(เส้นประ = กำลังโหลดเส้นทางถนน)</span>${data.riders.map((r) => `<div><span class="dot" style="background:${r.color}"></span>ไรเดอร์คนที่ ${r.riderNo}: ${r.stops.length} จุด · ${r.km} กม. · ถึง ${r.finishTime}</div>`).join("")}</div>`;
    }

    /* ---------- แผนที่ ---------- */
    function openMap() {
      if (!data) return;
      $("mapModal").classList.add("open"); mapOpen = true; saveState();
      if (!map) {
        map = L.map("map");
        L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 19, attribution: "© OpenStreetMap" }).addTo(map);
        layer = L.layerGroup().addTo(map);
      }
      setTimeout(() => { map.invalidateSize(); drawMap(); }, 50);
    }
    function closeMap() { $("mapModal").classList.remove("open"); mapOpen = false; saveState(); }
    document.addEventListener("keydown", (e) => e.key === "Escape" && closeMap());

    let drawToken = 0;
    const roadCache = new Map();
    // ขอเส้นทางตามถนนจริงจาก OSRM (บริการสาธารณะฟรี) คืน null ถ้าขอไม่ได้ จะใช้เส้นตรงแทน
    async function roadRoute(pts) {
      const key = pts.map((p) => p.join(",")).join(";");
      if (!roadCache.has(key)) {
        roadCache.set(key, fetch("https://router.project-osrm.org/route/v1/driving/" + pts.map((p) => p[1] + "," + p[0]).join(";") + "?overview=full&geometries=geojson")
          .then((r) => r.json())
          .then((j) => (j.routes?.[0] ? j.routes[0].geometry.coordinates.map(([lng, lat]) => [lat, lng]) : null))
          .catch(() => null));
      }
      return roadCache.get(key);
    }

    function drawMap() {
      if (!map || !data) return;
      const token = ++drawToken;
      renderSide();
      layer.clearLayers();
      const all = [[SHOP.lat, SHOP.lng]];
      L.marker([SHOP.lat, SHOP.lng], { icon: L.divIcon({ className: "", html: `<div class="pin" style="background:#222;width:30px;height:30px;font-size:16px">🏪</div>`, iconSize: [30, 30], iconAnchor: [15, 15] }) }).bindTooltip("ร้าน").addTo(layer);
      data.riders.forEach((r) => {
        const pts = [[SHOP.lat, SHOP.lng], ...r.stops.map((s) => [s.lat, s.lng])];
        // วาดเส้นตรงบาง ๆ ไปก่อน แล้วเปลี่ยนเป็นเส้นตามถนนจริงเมื่อ OSRM ตอบกลับ
        const fallback = L.polyline(pts, { color: r.color, weight: 3, opacity: 0.6, dashArray: "6 8" }).addTo(layer);
        roadRoute(pts).then((road) => {
          if (token !== drawToken || !road) return;
          fallback.remove();
          L.polyline(road, { color: r.color, weight: 5, opacity: 0.9 }).addTo(layer);
        });
        r.stops.forEach((s, i) => {
          all.push([s.lat, s.lng]);
          L.marker([s.lat, s.lng], { icon: L.divIcon({ className: "", html: `<div class="pin" style="background:${r.color}">${i + 1}</div>`, iconSize: [24, 24], iconAnchor: [12, 12] }) })
            .bindPopup(`<b>ไรเดอร์คนที่ ${r.riderNo} · จุดที่ ${i + 1}</b><br>${esc(s.name)} (${esc(s.phone)})<br>${esc(s.address)}<br>${s.boxes} กล่อง · ถึง ${r.arrivals[i]}`)
            .addTo(layer);
        });
      });
      map.invalidateSize();
      map.fitBounds(all, { padding: [40, 40] });
    }

    /* ---------- ล้างแผน (หลังส่งเสร็จ) ---------- */
// ถ้ายืนยันแผนไว้แล้ว จะลบแผนนั้นออกจากระบบด้วย (เลขใบงานใช้ไม่ได้) ออเดอร์ไม่ถูกลบ
async function clearPlan() {
  const saved = confirmedPlan;
  if (!confirm(saved ? "ล้างแผนนี้? แผนที่ยืนยันแล้วจะถูกลบออกจากระบบ และเลขใบงานของไรเดอร์จะใช้ไม่ได้ (ออเดอร์ยังอยู่ ไม่ถูกลบ)" : "ล้างแผนที่คำนวณไว้ในหน้านี้? (ออเดอร์ในระบบยังอยู่ ไม่ถูกลบ)")) return;
  if (saved) {
    try { await call("/route/plan/" + saved.planId, "DELETE"); }
    catch (e) { if (!/not found/i.test(e.message)) { toast(e.message); return; } }
  }
  saveStateClear();
  closeMapQuiet();
  loadOrders();
  toast("ล้างแผนแล้ว พร้อมจัดเส้นทางรอบใหม่");
  window.scrollTo({ top: 0, behavior: "smooth" });
}
function closeMapQuiet() { $("mapModal").classList.remove("open"); mapOpen = false; if (layer) layer.clearLayers(); }

// ลบทุกแผนที่ยืนยันไว้ของวันที่เลือก (รวมที่ยืนยันจากเครื่องอื่น) ออเดอร์ไม่ถูกลบ
async function deleteDayPlans() {
  const d = $("date").value;
  if (!confirm(`ลบแผนที่ยืนยันไว้ทั้งหมดของวันที่ ${d}? เลขใบงานของวันนั้นจะใช้ไม่ได้ (ออเดอร์ไม่ถูกลบ)`)) return;
  try {
    const r = await call("/route/plan?date=" + encodeURIComponent(d), "DELETE");
    saveStateClear(); closeMapQuiet(); await loadOrders();
    toast(r.affected_row ? `ลบแผนของวันที่ ${d} แล้ว ${r.affected_row} แผน` : "วันที่เลือกไม่มีแผนที่ยืนยันไว้");
  } catch (e) { toast(e.message); }
}

/* ---------- ยืนยันแผน ---------- */
    function showPlan(r) {
      $("confirmed").style.display = "";
      $("jobs").innerHTML = `<p class="msg">แผน #${r.planId} · ${r.summary.riders} ไรเดอร์ · กำไร ${money(r.summary.profit)}</p>` +
        `<table><thead><tr><th>ไรเดอร์</th><th>เลขใบงาน</th><th class="n">กล่อง</th><th class="n">เสร็จ</th></tr></thead><tbody>${r.riders.map((x) =>
          `<tr><td><span class="dot" style="background:${x.color}"></span>คนที่ ${x.riderNo}</td><td><b style="font-size:18px;letter-spacing:2px">${esc(x.code)}</b></td><td class="n">${x.boxes}</td><td class="n">${x.finishTime}</td></tr>`).join("")}</tbody></table>`;
    }
    // กด "ยืนยันแผนนี้" → บันทึกแผนและออกเลขใบงาน 6 หลักให้ไรเดอร์แต่ละคน
    async function confirmPlan() {
      if (data.summary.profit < 0 && !confirm("แผนนี้ขาดทุน ต้องการยืนยันจริงหรือไม่?")) return;
      try {
        const r = await call("/route/plan", "POST", { date: data.date, seed: data.seed });
        confirmedPlan = r; showPlan(r); saveState();
        toast("ยืนยันแผนแล้ว แจ้งเลขใบงานให้ไรเดอร์แต่ละคน");
        $("confirmed").scrollIntoView({ behavior: "smooth" });
      } catch (e) { toast(e.message); }
    }

    loadOrders().then(restoreState);
  </script>
</body>

</html>
