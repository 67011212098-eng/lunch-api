<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ใบงานไรเดอร์ - เส้นทางอร่อย</title>
<link rel="stylesheet" href="common.css">
<script src="auth.js" data-role="any"></script>
<style>
body{font-size:17px}
.wrap{max-width:480px;margin:0 auto;padding:14px}
h2.t{font-size:18px;margin:18px 0 8px}
#code{width:100%;font-size:26px;letter-spacing:8px;text-align:center;padding:12px;border:2px solid var(--line);border-radius:10px}
.b{display:block;width:100%;text-align:center;text-decoration:none;font:inherit;font-weight:700;padding:14px;border:0;border-radius:12px;background:var(--brand);color:#fff;margin-top:10px;cursor:pointer}
.b.sec{background:#fff;color:var(--brand);border:2px solid var(--brand)}
.err{color:#c92a2a;margin-top:8px}
.head{color:#fff;border-radius:14px;padding:14px;margin-bottom:12px}
.head b{font-size:22px}
.sum{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.sum div{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.sum span{display:block;font-size:13px;color:var(--mute)}
.sum b{font-size:22px}
.stop{display:flex;gap:12px;margin-bottom:12px}
.num{flex:none;width:38px;height:38px;border-radius:50%;color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center}
.stop h3{margin:0 0 2px;font-size:18px}
.stop p{margin:2px 0;color:var(--mute);font-size:15px}
.stop .b{padding:10px;margin-top:8px;font-size:16px}
.tag{display:inline-block;background:var(--brand-soft);color:var(--brand);border-radius:8px;padding:2px 8px;font-size:14px;font-weight:700}
.wait{text-align:center;padding:30px 10px}.wait .ic{font-size:48px}
</style>
</head>
<body>
<div id="top"></div>
<div class="wrap">
  <div class="card" id="login">
    <label>กรอกเลขใบงาน 6 หลัก</label>
    <input id="code" inputmode="numeric" maxlength="6" placeholder="••••••" autocomplete="off">
    <button class="b" onclick="loadFromInput()">ดูใบงาน</button>
    <div class="err" id="err"></div>
  </div>
  <div id="job"></div>
</div>
<script src="common.js"></script>
<script>
renderTop("rider", false);

// ไรเดอร์: ใช้เลขใบงานจากตอนล็อกอินเท่านั้น (ดูงานคนอื่นไม่ได้) / เจ้าของร้าน: กรอกเลขหรือใส่ ?code= เพื่อดูแทนได้
const S = Auth.session();
const isRider = S && S.role === "rider";
let current = isRider ? S.code : new URLSearchParams(location.search).get("code");
let lastJson = "";

function loadFromInput() {
  const c = $("code").value.trim();
  $("err").textContent = "";
  if (!/^\d{6}$/.test(c)) { $("err").textContent = "เลขต้องเป็นตัวเลข 6 หลัก"; return; }
  current = c; lastJson = ""; refresh(true);
}

async function refresh(manual) {
  if (!current) return;
  try {
    const j = await call("/job/" + current);
    const json = JSON.stringify(j);
    if (json === lastJson) return; // ไม่มีอะไรเปลี่ยน ไม่ต้องวาดใหม่
    lastJson = json;
    $("login").style.display = "none";
    show(j);
    if (!isRider) history.replaceState(null, "", "?code=" + current);
  } catch (e) {
    if (/not found/i.test(e.message)) {
      if (isRider) { $("login").style.display = "none"; $("job").innerHTML = `<div class="card wait"><div class="ic">⚠️</div><p>เลขใบงานนี้ใช้ไม่ได้แล้ว (แผนอาจถูกยกเลิก)<br>ติดต่อร้านเพื่อขอเลขใหม่</p><button class="b" onclick="Auth.logout()">ออกจากระบบ</button></div>`; }
      else { $("login").style.display = ""; $("err").textContent = "ไม่พบเลขใบงานนี้ ตรวจเลขอีกครั้ง"; }
    } else if (manual) { $("err").textContent = e.message; }
  }
}

function show(j) {
  $("job").innerHTML = `
    <div class="head" style="background:${j.color}">ไรเดอร์คนที่ <b>${j.riderNo}</b><br>วันที่ ${esc(j.date)}</div>
    <div class="sum">
      <div><span>ข้าวกล่องที่ต้องหยิบ</span><b>${j.boxes} กล่อง</b></div>
      <div><span>จำนวนจุดส่ง</span><b>${j.stops.length} จุด</b></div>
      <div><span>ออกจากร้าน</span><b>${esc(j.departTime)}</b></div>
      <div><span>ต้องส่งให้เสร็จก่อน</span><b>${esc(j.deadlineTime)}</b></div>
    </div>
    <a class="b" href="${esc(j.mapUrl)}" target="_blank" rel="noopener">🗺️ เปิดแผนที่นำทางทั้งเส้นทาง</a>
    <h2 class="t">ลำดับการส่ง</h2>
    ${j.stops.map((s) => `
      <div class="card stop">
        <div class="num" style="background:${j.color}">${s.seq}</div>
        <div style="flex:1">
          <h3>จุดที่ ${s.seq}: บ้านคุณ ${esc(s.name)}</h3>
          <p>📍 ${esc(s.address)}</p>
          <p>📦 <span class="tag">${s.boxes} กล่อง</span> · ถึงโดยประมาณ <b>${esc(s.eta)}</b></p>
          <a class="b sec" href="tel:${esc(s.phone)}">📞 โทร ${esc(s.phone)}</a>
          <a class="b" href="${esc(s.mapUrl)}" target="_blank" rel="noopener">🧭 นำทางไปจุดนี้</a>
        </div>
      </div>`).join("")}
    <p class="msg" style="text-align:center">รวมระยะทาง ${j.km} กม. · คาดว่าเสร็จ ${esc(j.finishTime)}</p>
    ${isRider ? "" : `<a class="b sec" href="rider.html">ใส่เลขใบงานอื่น</a>`}`;
}

$("code").addEventListener("keydown", (e) => e.key === "Enter" && loadFromInput());
if (isRider) $("login").style.display = "none";
refresh(true);
setInterval(refresh, 15000); // เช็กทุก 15 วินาที ถ้าร้านลบแผนจะขึ้นว่าเลขใบงานใช้ไม่ได้แล้ว
</script>
</body>
</html>
